<div class="app">
  <header class="app__header">
    <div>
      <p class="app__eyebrow">GNX · Sample Harness</p>
      <h1>{{ title }}</h1>
      <p class="app__sub">
        3-pane frozen · sort / filter · lazy <em>or</em> all-data (static)
        ({{ dataSource.source.totalCount() | number }} records) ·
        strategy <strong>{{ dataSource.strategy() }}</strong>
        @if (dataSource.source.isStatic) {
          · in-memory
        }
      </p>
    </div>

    <div class="app__strategies" role="group" aria-label="Pagination strategy">
      @for (s of strategies; track s) {
        <button
          type="button"
          class="strategy-btn"
          [class.strategy-btn--active]="dataSource.strategy() === s"
          (click)="setStrategy(s)"
        >
          {{ s }}
        </button>
      }
    </div>
  </header>

  <main class="app__main">
    <app-viewport-switcher />
  </main>
</div>

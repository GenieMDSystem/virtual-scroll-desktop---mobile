<div
  class="mobile-shell"
  #shell
  [class.mobile-shell--fit]="fitToContent()"
  [class.mobile-shell--no-meta]="!showMeta()"
>
  @if (showMeta()) {
    <header class="mobile-shell__meta" #meta>
      <div>
        <h2>{{ title() }}</h2>
        <p>
          {{ dataSource().totalCount() | number }} total ·
          loaded {{ dataSource().loadedCount() | number }} ·
          item {{ itemSize() }}px ·
          {{ dataSource().strategy }}
          @if (fitToContent()) {
            · fit
          }
        </p>
      </div>
      @if (dataSource().loading()) {
        <span class="pill">Loading…</span>
      }
    </header>
  }

  <cdk-virtual-scroll-viewport
    class="list-viewport"
    [class.list-viewport--fit]="fitToContent() && isFitted()"
    [style.height.px]="fitToContent() ? viewportHeightPx() : null"
    [itemSize]="itemSize()"
    [minBufferPx]="itemSize() * 4"
    [maxBufferPx]="itemSize() * 8"
    role="list"
    [attr.aria-label]="ariaLabel()"
  >
    <div
      class="item-slot"
      *cdkVirtualFor="let row of dataSource().items(); trackBy: dataSource().trackByIndex; let i = index"
      [style.height.px]="itemSize()"
    >
      @if (row; as item) {
        <ng-container
          *ngTemplateOutlet="
            itemDef().templateRef;
            context: { $implicit: item, item: item, index: i }
          "
        />
      } @else {
        <div class="item-skeleton" role="listitem"></div>
      }
    </div>
  </cdk-virtual-scroll-viewport>
</div>
